# Paddock Parking PMS nginx vhost
# Domain placeholder — replace PADDOCK_PMS_DOMAIN then enable + certbot.
# Isolated ports (avoid FMS / Phoenix / trailhead):
#   web 127.0.0.1:3040
#   api 127.0.0.1:4040
#
# Enable when subdomain is ready (pms.paddockparking.com):
#   1. sed -i 's/PADDOCK_PMS_DOMAIN/pms.paddockparking.com/g' /etc/nginx/sites-available/paddock-pms
#   2. sudo ln -sfn /etc/nginx/sites-available/paddock-pms /etc/nginx/sites-enabled/paddock-pms
#   3. sudo certbot --nginx -d pms.paddockparking.com
#   4. sudo nginx -t && sudo systemctl reload nginx

upstream paddock_pms_web {
    server 127.0.0.1:3040;
    keepalive 8;
}

upstream paddock_pms_api {
    server 127.0.0.1:4040;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name PADDOCK_PMS_DOMAIN;

    client_max_body_size 20m;

    # Frontend calls /api/* — strip prefix so Nest routes stay /health, /bookings, …
    location /api/ {
        proxy_pass http://paddock_pms_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://paddock_pms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://paddock_pms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
