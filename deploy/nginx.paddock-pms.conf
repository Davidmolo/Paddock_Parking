# Phoenix Storage Yards PMS only.
# Do not edit FMS, WMS, or any other app's nginx file.
# This vhost uses its own ports so it does not share Fuelcap's process:
#   web 127.0.0.1:3040
#   api 127.0.0.1:4040
#
# pms.phoenixstorageyards.com  → staff (admin)
# www.phoenixstorageyards.com  → customer website and customer portal
#
# Both hosts are private. The password page is /paddock-gate.
# The checker is paddock-gate.service on 127.0.0.1:9099.
# Do not remove auth_request. A plain proxy would put the site back in public.
#
# Fuelcap's sign-in is /auth/signin. This app's staff sign-in is /login.
# An explicit server_name here wins over FMS's default site. Leave FMS's file as it is.

upstream paddock_pms_web {
    server 127.0.0.1:3040;
    keepalive 8;
}

upstream paddock_pms_api {
    server 127.0.0.1:4040;
    keepalive 8;
}

# Staff
server {
    listen 80;
    listen [::]:80;
    server_name pms.phoenixstorageyards.com;

    client_max_body_size 20m;

    location = /paddock-gate {
        alias /var/www/paddock-gate/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /paddock-gate/login {
        proxy_pass http://127.0.0.1:9099/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
    }

    location = /_gate_check {
        internal;
        proxy_pass http://127.0.0.1:9099/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/signin {
        auth_request /_gate_check;
        error_page 401 = @go_gate;
        try_files /paddock-gate-noop @to_login;
    }

    location @to_login {
        return 302 /login;
    }

    location ~ ^/(portal|book)(/|$) {
        auth_request /_gate_check;
        error_page 401 = @go_gate;
        try_files /paddock-gate-noop @to_www;
    }

    location @to_www {
        return 302 https://www.phoenixstorageyards.com$request_uri;
    }

    location /api/ {
        auth_request /_gate_check;
        error_page 401 = @go_gate;
        proxy_pass http://paddock_pms_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        auth_request /_gate_check;
        error_page 401 = @go_gate;
        proxy_pass http://paddock_pms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_gate_check;
        error_page 401 = @go_gate;
        proxy_pass http://paddock_pms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @go_gate {
        return 302 /paddock-gate;
    }
}

# Customer website + portal
server {
    listen 80;
    listen [::]:80;
    server_name www.phoenixstorageyards.com;

    client_max_body_size 20m;

    location = /paddock-gate {
        alias /var/www/paddock-gate/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
