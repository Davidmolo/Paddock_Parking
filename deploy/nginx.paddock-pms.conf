# Phoenix Storage Yards PMS only.
# Do not edit FMS, WMS, or any other app's nginx file.
# This vhost uses its own ports so it does not share Fuelcap's process:
#   web 127.0.0.1:3040
#   api 127.0.0.1:4040
#
# pms.phoenixstorageyards.com  → staff (admin)
# www.phoenixstorageyards.com  → customer website and customer portal
#
# Fuelcap's sign-in is /auth/signin. This app's staff sign-in is /login.
# An explicit server_name here wins over FMS's default site. Leave FMS's file as it is.

upstream paddock_pms_web {
    server 127.0.0.1:3040;
    keepalive 8;
}

upstream paddock_pms_api {
    server 127.0.0.1:4040;
    keepalive 8;
}

# Staff
server {
    listen 80;
    listen [::]:80;
    server_name pms.phoenixstorageyards.com;

    client_max_body_size 20m;

    location = /auth/signin {
        return 302 /login;
    }

    location ~ ^/(portal|book)(/|$) {
        return 302 https://www.phoenixstorageyards.com$request_uri;
    }

    location /api/ {
        proxy_pass http://paddock_pms_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://paddock_pms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://paddock_pms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Customer website + portal
server {
    listen 80;
    listen [::]:80;
    server_name www.phoenixstorageyards.com;

    client_max_body_size 20m;

    location = / {
        return 302 /book;
    }

    location ~ ^/(login|dashboard|bookings|customers|collections|leases|lots|invoices|notifications|properties|compliance|profile|leads)(/|$) {
        return 302 https://pms.phoenixstorageyards.com$request_uri;
    }

    location /api/ {
        proxy_pass http://paddock_pms_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://paddock_pms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://paddock_pms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
