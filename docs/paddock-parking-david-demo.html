<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paddock Parking — Demo for David</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a222c;
        --surface-2: #232d3a;
        --border: #2e3a48;
        --ink: #e8eef4;
        --muted: #9aabbc;
        --accent: #2dd4bf;
        --accent-soft: rgba(45, 212, 191, 0.12);
        --danger: #f87171;
        --ok: #4ade80;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 1.75rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 5;
      }

      .eyebrow {
        margin: 0 0 0.35rem;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 2.4vw, 1.9rem);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .nav-btns {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--ink);
        border-radius: 0.65rem;
        padding: 0.55rem 0.95rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #042f2e;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      main {
        flex: 1;
        padding: 1.35rem 1.75rem 1rem;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
      }

      .slide {
        display: none;
        animation: fade 0.25s ease;
      }

      .slide.active {
        display: block;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .lead {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.5;
        font-size: 1rem;
      }

      .callout {
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 0.75rem;
        padding: 0.9rem 1rem;
        margin-bottom: 1.1rem;
        line-height: 1.45;
      }

      .callout.ok {
        border-left-color: var(--ok);
        background: rgba(74, 222, 128, 0.08);
      }

      .callout strong {
        display: block;
        margin-bottom: 0.25rem;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 0.85rem;
      }

      .grid.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      @media (max-width: 800px) {
        .grid.cols-2,
        .grid.cols-3 {
          grid-template-columns: 1fr;
        }

        .top {
          flex-direction: column;
        }
      }

      .card {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 0.85rem;
        overflow: hidden;
      }

      .card h3 {
        margin: 0;
        padding: 0.75rem 1rem;
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }

      .card .body {
        padding: 0.9rem 1rem 1.05rem;
      }

      .card .body p {
        margin: 0 0 0.5rem;
        line-height: 1.45;
      }

      .card .body p:last-child {
        margin-bottom: 0;
      }

      .feature {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 0.85rem;
        padding: 1rem 1.1rem;
        margin-bottom: 0.75rem;
      }

      .feature:last-child {
        margin-bottom: 0;
      }

      .feature h4 {
        margin: 0 0 0.35rem;
        font-size: 1.02rem;
        font-weight: 650;
      }

      .feature .what,
      .feature .why,
      .feature .do {
        margin: 0.35rem 0 0;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .feature .label {
        display: inline-block;
        min-width: 4.2rem;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        margin-right: 0.35rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 0 0 1rem;
      }

      @media (max-width: 800px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .stat {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 0.85rem;
        padding: 0.9rem 1rem;
      }

      .stat .v {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .stat .v.danger {
        color: var(--danger);
      }

      .stat .l {
        margin-top: 0.35rem;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.35;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid var(--border);
        border-radius: 0.85rem;
        overflow: hidden;
        background: var(--surface);
      }

      th,
      td {
        text-align: left;
        padding: 0.75rem 0.9rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        line-height: 1.4;
      }

      th {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: var(--surface-2);
      }

      tr:last-child td {
        border-bottom: none;
      }

      ol.steps {
        margin: 0;
        padding-left: 1.2rem;
      }

      ol.steps li {
        margin: 0.65rem 0;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem 1.75rem 1.25rem;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .dot {
        min-width: 1.7rem;
        height: 1.7rem;
        padding: 0 0.35rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .dot.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #042f2e;
      }

      .hint {
        font-size: 0.8rem;
        color: var(--muted);
      }

      kbd {
        border: 1px solid var(--border);
        background: var(--surface-2);
        border-radius: 0.35rem;
        padding: 0.1rem 0.35rem;
        font-size: 0.75rem;
      }
    </style>
  </head>

                <tr><td>4</td><td>Customer COI</td><td>Mismatch when entity isn’t 325 LLC</td><td>ValleyWide on /customers</td></tr>
                <tr><td>5</td><td>Leases</td><td>Landlord vs tenant + Edit renewal/lead days</td><td>/leases</td></tr>
                <tr><td>6</td><td>Notices</td><td>Generate + send renewal/COI messages</td><td>/notifications</td></tr>
                <tr><td>7</td><td>Book Now</td><td>Convert booking → tenant + lot</td><td>/bookings</td></tr>
              </tbody>
            </table>
            <div class="callout" style="margin-top:0.85rem">
              <strong>Credentials</strong>
              admin / paddockparking · App http://localhost:3001 · API http://localhost:4001
            </div>
          `,
        },
        {
          title: "What's next",
          subtitle: "Prototype vs production",
          html: `
            <div class="grid cols-2">
              <div class="card"><h3>Already working in the demo</h3><div class="body">
                <p>All priority ops screens</p>
                <p>Landlord + tenant leases with notice windows</p>
                <p>COI entity matching + uploads</p>
                <p>Notice generation queue (demo send)</p>
                <p>Book Now convert path</p>
              </div></div>
              <div class="card"><h3>Production upgrades</h3><div class="body">
                <p>Real database + import from current admin</p>
                <p>SendGrid / Twilio for live email & SMS</p>
                <p>QuickBooks sync for live money figures</p>
                <p>Wire paddockparking.com Book Now → this API</p>
              </div></div>
            </div>
            <div class="callout ok" style="margin-top:0.85rem">
              <strong>Ask for David</strong>
              What should we productionize first: data migration, live notifications, or QuickBooks?
            </div>
          `,
        },
      ];

      let index = 0;
      const titleEl = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");
      const eyebrowEl = document.getElementById("eyebrow");
      const deck = document.getElementById("deck");
      const dots = document.getElementById("dots");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");

      function render() {
        const s = slides[index];
        titleEl.textContent = s.title;
        subtitleEl.textContent = s.subtitle || "";
        subtitleEl.style.display = s.subtitle ? "block" : "none";
        eyebrowEl.textContent = `Paddock Parking · Demo for David · Slide ${index + 1} / ${slides.length}`;
        deck.innerHTML = `<section class="slide active">${s.html}</section>`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
        nextBtn.textContent = index === slides.length - 1 ? "Done" : "Next";
        [...dots.children].forEach((d, i) => {
          d.classList.toggle("active", i === index);
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      slides.forEach((_, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "dot";
        b.textContent = String(i + 1);
        b.title = slides[i].title;
        b.addEventListener("click", () => {
          index = i;
          render();
        });
        dots.appendChild(b);
      });

      prevBtn.addEventListener("click", () => {
        if (index > 0) {
          index -= 1;
          render();
        }
      });
      nextBtn.addEventListener("click", () => {
        if (index < slides.length - 1) {
          index += 1;
          render();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          if (index < slides.length - 1) {
            index += 1;
            render();
          }
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (index > 0) {
            index -= 1;
            render();
          }
        }
      });

      render();
    </script>
  </body>
</html>
