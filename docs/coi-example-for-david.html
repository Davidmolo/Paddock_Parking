<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate example for approval</title>
  <style>
    * { box-sizing: border-box; }
    @page { size: A4; margin: 0; }
    html, body {
      margin: 0;
      background: #e8e8e8;
      color: #141c28;
    }
    main {
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      background: #fff;
    }
    img {
      width: 210mm;
      height: 297mm;
      display: block;
      object-fit: contain;
    }
    @media (max-width: 210mm) {
      main, img { width: 100%; height: auto; }
    }
  </style>
</head>
<body>
  <main>
    <img src="coi-example-for-david.png" alt="Certificate of liability insurance example">
  </main>
</body>
</html>
