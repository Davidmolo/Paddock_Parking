name: Deploy Paddock PMS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

concurrency:
  group: paddock-pms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install & build
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @paddockparking/api build
          pnpm --filter @paddockparking/web build

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PADDOCK_PMS_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.PADDOCK_PMS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync release to server
        env:
          HOST: ${{ secrets.PADDOCK_PMS_HOST }}
          USER: ${{ secrets.PADDOCK_PMS_USER }}
        run: |
          RSYNC_SSH="ssh -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'apps/api/node_modules' \
            --exclude 'apps/web/node_modules' \
            --exclude 'apps/api/.env' \
            --exclude 'apps/web/.env*' \
            --exclude 'apps/web/.next/cache' \
            --exclude 'apps/api/uploads' \
            --exclude 'apps/api/data' \
            --exclude '*.traineddata' \
            --exclude '*.log' \
            -e "$RSYNC_SSH" \
            ./ "${USER}@${HOST}:/var/www/paddock-pms/"

      - name: Install deps, reload PM2 (paddock only)
        env:
          HOST: ${{ secrets.PADDOCK_PMS_HOST }}
          USER: ${{ secrets.PADDOCK_PMS_USER }}
        run: |
          ssh "${USER}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          APP=/var/www/paddock-pms
          mkdir -p "$APP/logs"

          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@9
          fi

          cd "$APP"
          pnpm install --frozen-lockfile --prod=false

          # Install nginx template only if missing / still a placeholder.
          NGINX_SITE=/etc/nginx/sites-available/paddock-pms
          if [[ -f "$APP/deploy/nginx.paddock-pms.conf" ]]; then
            if [[ ! -f "$NGINX_SITE" ]] || grep -q 'PADDOCK_PMS_DOMAIN' "$NGINX_SITE"; then
              sudo cp "$APP/deploy/nginx.paddock-pms.conf" "$NGINX_SITE"
            fi
          fi

          cd "$APP"
          pm2 startOrReload deploy/ecosystem.config.cjs --update-env
          pm2 save

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4040/health; then
              ok=1
              break
            fi
            sleep 2
          done
          [[ "$ok" -eq 1 ]] || exit 1
          echo
          curl -fsS -o /dev/null -w "web:%{http_code}\n" http://127.0.0.1:3040/ || true
          pm2 list | grep paddock || true
          REMOTE
